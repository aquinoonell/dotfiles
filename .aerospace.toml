# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# SMOOTHNESS OPTIMIZATIONS
# You can use it to add commands that run after AeroSpace startup.
# Pre-create workspaces for instant switching
after-startup-command = [
    'exec-and-forget borders active_color=0xfffabd2f inactive_color=0xff928374 width=6.0',
    'workspace 1',
    'workspace 2', 
    'workspace 3',
    'workspace 4',
    'workspace T',
    'workspace B',
    'workspace 1'
]

# Start AeroSpace at login
start-at-login = true

# SMOOTHNESS: Disable normalizations that can cause stuttering
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# SMOOTHNESS: Reduce padding for faster rendering
accordion-padding = 8

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# SMOOTHNESS: Mouse follows focus - optimized for responsiveness
# Using lazy center for instant response without animation delays
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# SMOOTHNESS: Instantly show/unhide apps for fluid workflow
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# SMOOTHNESS: Minimal inner gaps, zero outer gaps so windows sit flush with screen edges
[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

# PERFORMANCE-OPTIMIZED APPLICATION-TO-WORKSPACE ASSIGNMENT
# Use exact app names instead of regex when possible for better performance
# Only define rules for apps you actually use regularly

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace T']

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace B']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']


[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['layout floating']


[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['layout floating']


[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating']


# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # SMOOTHNESS: Quick layout switching
    alt-space = 'layout tiles horizontal vertical'
    alt-shift-space = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen'

    # SMOOTHNESS: Enhanced navigation with predictive focus
    alt-h = ['focus left', 'move-mouse window-lazy-center']
    alt-j = ['focus down', 'move-mouse window-lazy-center'] 
    alt-k = ['focus up', 'move-mouse window-lazy-center']
    alt-l = ['focus right', 'move-mouse window-lazy-center']

    # SMOOTHNESS: Instant window movement with visual feedback
    alt-shift-h = ['move left', 'move-mouse window-lazy-center']
    alt-shift-j = ['move down', 'move-mouse window-lazy-center']
    alt-shift-k = ['move up', 'move-mouse window-lazy-center']
    alt-shift-l = ['move right', 'move-mouse window-lazy-center']

    # SMOOTHNESS: Progressive resizing for fine control
    alt-minus = 'resize smart -25'
    alt-equal = 'resize smart +25'
    alt-shift-minus = 'resize smart -100'
    alt-shift-equal = 'resize smart +100'

    # SMOOTHNESS: Instant workspace switching - no delays
    alt-1 = ['workspace 1', 'move-mouse monitor-lazy-center']
    alt-2 = ['workspace 2', 'move-mouse monitor-lazy-center']
    alt-3 = ['workspace 3', 'move-mouse monitor-lazy-center']
    alt-4 = ['workspace 4', 'move-mouse monitor-lazy-center']
    alt-9 = ['workspace T', 'move-mouse monitor-lazy-center']
    alt-0 = ['workspace B', 'move-mouse monitor-lazy-center']

    # SMOOTHNESS: Quick workspace assignment
    alt-shift-1 = ['move-node-to-workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3'] 
    alt-shift-4 = ['move-node-to-workspace 4'] 
    alt-shift-9 = ['move-node-to-workspace T']
    alt-shift-0 = ['move-node-to-workspace B']

    # SMOOTHNESS: Instant app launching with workspace switching
    alt-t = ['workspace T', 'exec-and-forget open -a "WezTerm"']
    alt-b = ['workspace B', 'exec-and-forget open -b "app.zen-browser.zen"']
    alt-c = ['workspace 4', 'exec-and-forget open -a "Cursor"']
    alt-o = ['exec-and-forget open -a "Obsidian"']

    # SMOOTHNESS: Fluid move-and-follow with mouse positioning
    alt-shift-ctrl-9 = ['move-node-to-workspace T', 'workspace T', 'move-mouse window-lazy-center']
    alt-shift-ctrl-0 = ['move-node-to-workspace B', 'workspace B', 'move-mouse window-lazy-center']
    alt-shift-ctrl-4 = ['move-node-to-workspace 4', 'workspace 4', 'move-mouse window-lazy-center']

    # SMOOTHNESS: Enhanced back-and-forth with mouse sync
    alt-tab = ['workspace-back-and-forth', 'move-mouse monitor-lazy-center']

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
