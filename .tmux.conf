# Tmux — his tokyo-night + Sora chrome; YOUR keybinds (prefix C-s, hjkl, theme-picker).
unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -ga update-environment "TERM_PROGRAM COLORTERM"

# YOUR prefix (his repo uses default C-b — we keep yours)
set -g prefix C-s

set -g mouse on
set -g allow-rename on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-activity on
set-option -g window-status-activity-style none
set-option -g status-position bottom
set -g status-justify left

# YOUR pane binds
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# YOUR theme picker (original binding: prefix + t)
bind-key t display-popup -E -w 80% -h 80% "$HOME/dotfiles/bin/theme-picker"
bind-key R run-shell "$HOME/dotfiles/bin/rice-layout"

# His useful popups, on YOUR prefix
bind-key y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind-key -T prefix b set-option -g status

# tokyo-night-tmux (Sora) — paints status after this file
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme "sora"
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_datetime 0
# "digital" uses U+1FBFx glyphs that no installed font has (shows as a broken box)
set -g @tokyo-night-tmux_window_id_style super

if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' \
  'run-shell "git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm"'

run-shell "$HOME/.tmux/plugins/tpm/tpm"

# Sora chrome (his bin/theme values for sora)
set -g mode-style "fg=#dce4f0,bg=#1e2430"
set -g pane-border-style "fg=#222838"
set -g pane-active-border-style "fg=#80c8e0"
set -g message-style "bg=#14161e,fg=#c8d0e0"

# YOUR sessionizer / github scripts
unbind f
bind-key f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh"
bind-key N run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh ~/.config/nvim/"
bind-key G run-shell "~/.config/scripts/open_github.sh"
