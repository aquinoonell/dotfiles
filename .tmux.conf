# Tmux — tokyo-night + YOUR keybinds. Tuned for snappy feel.
unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -ga update-environment "TERM_PROGRAM COLORTERM"

set -g prefix C-s

# ── speed ─────────────────────────────────────────────────────────────
set -s escape-time 0
set -g status-interval 30          # was 5 — status scripts spawn less often
set -g display-time 1000
set -g repeat-time 300
set -g history-limit 50000
set -g focus-events on
setw -g aggressive-resize on
# Activity monitoring forces status redraws; SketchyBar covers system stats
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

set -g mouse on
set -g allow-rename on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g status-position bottom
set -g status-justify left

# YOUR pane binds
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# YOUR theme picker
bind-key t display-popup -E -w 70% -h 60% "$HOME/dotfiles/bin/theme-picker"
bind-key R run-shell "$HOME/dotfiles/bin/rice-layout"

# Popups
bind-key y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind-key -T prefix b set-option -g status

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# Colors follow the active theme
run-shell "$HOME/dotfiles/bin/tmux-apply-theme --write-only"
set -g @tokyo-night-tmux_theme "custom"
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_window_id_style super
# Disable every status-right shell widget (git/net/battery/music/path/hostname).
# Those were spawning bash every status refresh; SketchyBar already covers them.
set -g @tokyo-night-tmux_show_git 0
set -g @tokyo-night-tmux_show_wbg 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_battery_widget 0
set -g @tokyo-night-tmux_show_music 0
set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_show_hostname 0
set -g @tokyo-night-tmux_show_right_widgets ""

if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' \
  'run-shell "git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm"'

run-shell "$HOME/.tmux/plugins/tpm/tpm"

# Ensure interval sticks after sensible (sensible defaults to 5)
set -g status-interval 30
# Empty right status — no #() script hooks left behind
set -g status-right ""
# Strip hostname #() from status-left (tokyo-night injects it even when disabled)
run-shell "$HOME/dotfiles/bin/tmux-strip-status-hooks"

run-shell "$HOME/dotfiles/bin/tmux-apply-theme --chrome"

# Session / project popups
unbind f
unbind s
bind-key f display-popup -E -w 70% -h 55% "$HOME/dotfiles/scripts/tmux-sessionizer.sh"
bind-key s display-popup -E -w 70% -h 50% "$HOME/dotfiles/scripts/tmux-session-switch.sh"
bind-key N display-popup -E -w 70% -h 55% "$HOME/dotfiles/scripts/tmux-sessionizer.sh $HOME/dotfiles/nvim"
bind-key G run-shell "$HOME/dotfiles/scripts/open_github.sh"
