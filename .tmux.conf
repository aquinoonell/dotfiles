# Minimal tmux - uses terminal colors (changes with theme)
unbind r
bind r source-file ~/.tmux.conf

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g allow-passthrough all
set -ga update-environment "KITTY_WINDOW_ID KITTY_PID TERM_PROGRAM COLORTERM"

# Prefix
set -g prefix C-s

# Mouse & vi
set -g mouse on
set-window-option -g mode-keys vi

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Theme picker
bind-key t display-popup -E -w 80% -h 80% "$HOME/dotfiles/bin/theme-picker"

# Status - minimal, transparent
set-option -g status-position top
set -g status-style "bg=default"
set -g status-left ""
set -g status-right "#[fg=color4]#S"
set -g status-justify centre

# No window indicators
set -g window-status-format ""
set -g window-status-current-format ""

# Pane borders - uses terminal colors
set -g pane-border-style "fg=color8"
set -g pane-active-border-style "fg=color6"
set -g pane-border-lines single

# Messages
set -g message-style "bg=default,fg=color6"

# Scripts
unbind f 
bind-key f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh"
bind-key N run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh ~/.config/nvim/"
bind-key G run-shell "~/.config/scripts/open_github.sh"
