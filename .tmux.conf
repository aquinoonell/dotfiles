unbind r
bind r source-file ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Let kitty/iterm/sixel graphics reach WezTerm through tmux popups (theme-picker previews)
set -g allow-passthrough all
set -g prefix C-s
set -g mouse on
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Theme picker (like sessionizer) - Ctrl-s t
bind-key t display-popup -E -w 80% -h 80% "$HOME/dotfiles/bin/theme-picker"

# Move status bar to top
set-option -g status-position top

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

# List of plugins - order matters!
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

# Load catppuccin theme first...
run '~/.tmux/plugins/tpm/tpm'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100

# Empty left side, everything on right including session
set -g status-left ""
set -g status-right ""
# Minimal window indicator
set -g window-status-format " "
set -g window-status-current-format ""
set -g window-status-separator "|"

# Post-plugin customizations
set -g status-style bg=default

# Pane border settings - CYAN/BLUE THEME (changed from green)
set -g pane-border-style fg=#444444
set -g pane-active-border-style fg=#34e2e2,bold  # Bright cyan instead of green

# Add padding/separation between panes
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Scripts for tmux
unbind f 
bind-key f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh"
bind-key N run-shell "tmux neww ~/.config/scripts/tmux-sessionizer.sh ~/.config/nvim/"
bind-key G run-shell "~/.config/scripts/open_github.sh"
